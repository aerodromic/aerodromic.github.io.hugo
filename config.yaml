params:
  title: "Joel Lo | Finance & Analytics"
  description: "Joel Lo — finance, quantitative research and applied analytics in Singapore. Explore my experience, selected projects and photography."
  images:
  - /images/JoelBoat.jpg
  staticPath: ""  # The path to serve the static files from
  favicon: /fav.png

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether the fade animations on the home page will be enabled
  animate: false

  theme:
    disableThemeToggle: false
    defaultTheme: "auto" # dark / light

  # font:
  #   fontSize: 1.5rem # default: 1rem
  #   fontWeight: 500 # default: 400
  #   lineHeight: 1 # default: 1.5
  #   textAlign: right # default: left

  color:
    textColor: "#182c38"
    secondaryTextColor: "#52616c"
    backgroundColor: "#f5f6f2"
    secondaryBackgroundColor: "#f8f9fa"
    primaryColor: "#087970"
    secondaryColor: "#f8f9fa"

    darkmode:
      textColor: "#e4e6eb"
      secondaryTextColor: "#b0b3b8"
      backgroundColor: "#18191a"
      secondaryBackgroundColor: "#212529"
      primaryColor: "#72d9c8"
      secondaryColor: "#212529"

  # If you want to customize the menu bar, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    # brandName: "Hugo Profile" # Brand name for the brand | default is the title variable
    disableSearch: true
    searchPlaceholder: "Search..."
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "FINANCE · ANALYTICS · SINGAPORE"
    title: "Joel Lo."
    subtitle: "Curiosity, backed by analysis."
    content: "I’m an Analyst in Private Banking Credit Operations at JPMorgan in Singapore. My background spans derivatives market analysis, quantitative research and machine learning, with an interest in turning complex data into useful decisions."
    image: /images/JoelTrain.jpg
    bottomImage:
      enable: false
      roundImage: false # Make hero image circular | default false
    button:
      enable: true
      name: "Explore my work"
      url: "#projects"
      download: false
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/aerodromic
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/joello/
        - icon: fab fa-instagram
          url: https://www.instagram.com/jouste_

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/JoelCam.jpg"
    content: |-
      I’m Joel, based in Singapore, with a background in Industrial & Systems Engineering at the National University of Singapore, Data Analytics and Computer Science.

      My work has taken me from dairy derivatives and systematic signals to demand forecasting and computer vision. I enjoy connecting technical models with the people and decisions they support.

      Outside work, I’m usually exploring somewhere new, taking photos or experimenting with a homebrewing project.
    skills:
      enable: true
      title: "Tools I use to investigate, model and communicate:"
      items:
        - "Python"
        - "SQL"
        - "Tableau"
        - "R"
        - "Excel / VBA"
        - "Git / Hugo"

