          url: "https://www.linkedin.com/in/joello/"
        content: "Working in Private Banking Credit Operations at JPMorgan in Singapore."

      - job: "Derivatives Analyst Intern"
        company: "Interfood"
        companyUrl: "https://www.interfood.com/en/"
        date: "Jun 2024 - Dec 2024"
        featuredLink:
          enable: true
          name: "Connect with me"
          url: "https://www.linkedin.com/in/joello/"
        content: "Analysed dairy futures and market data in Singapore. Built Python and Tableau reporting for Global Dairy Trade announcements and researched relative-value opportunities across dairy products."

      - job: "Quantitative Research Consultant"
        company: "WorldQuant"
        companyUrl: "https://www.worldquant.com/"
        date: "Joined Sep 2023"
        featuredLink:
          enable: true
          name: "Connect with me"
          url: "https://www.linkedin.com/in/joello/"
        content: "Researched and backtested systematic equity signals across US and China datasets, exploring price, volatility and fundamental features with sector-neutral portfolio construction."
      
      - job: "Summer Analyst"
        company: "Viettonkin Consulting"
        companyUrl: "https://www.viettonkinconsulting.com/"
        date: "May 2023 - Aug 2023"
        featuredLink:
          enable: true
          name: "Connect with me"
          url: "https://www.linkedin.com/in/joello/"
        content: "Supported ASEAN-focused foreign direct investment projects, business development and digital transformation in Vietnam. Worked on client relationships, partnership outreach and data-informed content planning."

      - job: "Student Research Assistant"
        company: "NUS"
        companyUrl: "https://cde.nus.edu.sg/undergraduate/build-your-own-degree/enhancement-modules/undergraduate-research-opportunities-programme-eg2605-urop/"
        date: "Jan 2023 - Apr 2023"
        featuredLink:
          enable: true
          name: "Read the Paper"
          url: "/files/uropReportJoel.pdf"
        content: "I conducted research at [NUS](https://cde.nus.edu.sg/undergraduate/build-your-own-degree/enhancement-modules/undergraduate-research-opportunities-programme-eg2605-urop/) to develop and implement transformer-based computer vision models, like DETR and Deformable DETR, to detect housekeeping issues on construction sites, under the supervision of Dr Goh Yang Miang."

