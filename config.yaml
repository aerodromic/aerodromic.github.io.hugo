    renderer:
      unsafe: true

sitemap:
  changefreq: weekly
  priority: 0.5

Menus:
  main:
    - identifier: blog
      name: Blog
      title: Blog Posts 📝
      url: /blog
      weight: 1
    
    - identifier: gallery
      name: Gallery
      title: My Photos 📷
      url: /gallery
      weight: 2

